name: Run Selenium tests every 15 minutes (Java 21, secure)

on:
  schedule:
    - cron: "*/15 * * * *"  # every 15 minutes (UTC)
  workflow_dispatch: {}      # allow manual trigger

permissions:
  id-token: write
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify ENCRYPTION_KEY availability
        run: |
          if [ -z "$ENCRYPTION_KEY" ]; then
            echo " ENCRYPTION_KEY not found!"
            exit 1
          else
            echo " ENCRYPTION_KEY is available."
          fi
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

      - name: Run Maven tests
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          echo "Running tests with Java 21 and secure key..."
          mvn -B clean test

